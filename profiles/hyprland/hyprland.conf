# ==========================================================================
#  Aki's daily driver — Hyprland + DankMaterialShell, frosted-glass look.
#  Branch aki/daily. Never merged into main; the YoRHa OS work lives elsewhere.
# ==========================================================================

# ==========================================
# Monitor
# ==========================================
# Refresh rate is managed by scripts/power-mode.sh: 60Hz on battery,
# native (165Hz) when plugged in.
monitor = , preferred, auto, 1

# ==========================================
# Environment
# ==========================================
# The screen is driven by the Intel iGPU (the RTX 4060 sleeps until a program
# asks for it), so hardware video decoding has to go through Intel's VA-API
# driver. Pointing it at nvidia made browsers decode video on the CPU.
env = LIBVA_DRIVER_NAME,iHD
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = XCURSOR_SIZE,24

# ==========================================
# Autostart
# ==========================================
# DMS is the whole shell: bar, notifications, lock screen, idle, wallpaper,
# launcher, clipboard, OSDs. Nothing else (dunst/hypridle/hyprpaper) should run
# next to it or they fight over the same jobs.
exec-once = dms run
exec-once = ~/.config/hypr/scripts/power-mode.sh

# ==========================================
# Look & feel — frosted glass
# ==========================================
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 1
    col.active_border = rgba(ffffff55)
    col.inactive_border = rgba(ffffff12)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 14

    blur {
        enabled = true      # power-mode.sh turns this off on battery
        size = 8
        passes = 3
        noise = 0.02
        contrast = 1.1
        brightness = 1.05
        vibrancy = 0.2
        popups = true
    }

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000045)
    }
}

animations {
    enabled = true
    bezier = glass, 0.22, 1, 0.36, 1
    animation = windows, 1, 5, glass, popin 85%
    animation = fade, 1, 4, glass
    animation = layers, 1, 4, glass, fade
    animation = workspaces, 1, 5, glass, slide
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ==========================================
# Input
# ==========================================
input {
    # English + Arabic; Alt+Shift switches, same as Windows.
    kb_layout = us,ara
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# 3-finger swipe on the touchpad to change workspace
gesture = 3, horizontal, workspace

# ==========================================
# Keybinds
# ==========================================
$mod = SUPER

# Apps
bind = $mod, Return, exec, kitty
bind = $mod, B, exec, zen-browser
bind = $mod, A, exec, pavucontrol

# DMS panels
bind = $mod, R, exec, dms ipc call spotlight toggle
bind = $mod SHIFT, V, exec, dms ipc call clipboard toggle
bind = $mod, N, exec, dms ipc call notifications toggle
bind = $mod, comma, exec, dms ipc call settings toggle
bind = $mod, Escape, exec, dms ipc call lock lock

# Windows
bind = $mod, Q, killactive
bind = $mod SHIFT, Q, exit
bind = $mod, F, fullscreen, 0
bind = $mod, V, togglefloating,
bind = $mod, P, pseudo,
bind = $mod, J, layoutmsg, togglesplit

bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

binde = $mod ALT, right, resizeactive, 30 0
binde = $mod ALT, left, resizeactive, -30 0
binde = $mod ALT, up, resizeactive, 0 -30
binde = $mod ALT, down, resizeactive, 0 30

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshots (saved to ~/Pictures/Screenshots + copied to clipboard)
bind = , Print, exec, ~/.config/hypr/scripts/yorha-shot.sh region
bind = $mod SHIFT, S, exec, ~/.config/hypr/scripts/yorha-shot.sh region
bind = SHIFT, Print, exec, ~/.config/hypr/scripts/yorha-shot.sh full
bind = ALT, Print, exec, ~/.config/hypr/scripts/yorha-shot.sh window
bind = $mod, S, exec, ~/.config/hypr/scripts/yorha-shot.sh edit

# Audio / media / brightness
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
binde = , XF86MonBrightnessUp, exec, brightnessctl set +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod, Tab, workspace, previous
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# ==========================================
# Window rules (Hyprland 0.53+ match: syntax)
# ==========================================
windowrule = float on, match:class ^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = size 600 400, match:class ^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = center on, match:class ^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:title ^(Picture-in-Picture)$
windowrule = float on, match:title ^(Open File|Save File|Open Folder|Save As)(.*)$

# ==========================================
# Layer rules — glass behind every DMS panel
# ==========================================
layerrule = blur on, match:namespace ^(dms:.*)$
layerrule = ignore_alpha 0.2, match:namespace ^(dms:.*)$
