# ==========================================
# Monitor
# ==========================================
monitor = , preferred, auto, 1

# ==========================================
# Environment Variables (NVIDIA + Electron)
# ==========================================
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ==========================================
# Autostart
# ==========================================
exec-once = waybar
exec-once = dunst

# ==========================================
# Modifier Configuration
# ==========================================
$mod = SUPER

# ==========================================
# Core Applications & Utilities
# ==========================================
bind = $mod, Return, exec, kitty
bind = $mod, Q, killactive
bind = $mod SHIFT, Q, exit
bind = $mod, R, exec, rofi -show drun
bind = $mod, B, exec, zen-browser
bind = $mod, A, exec, pavucontrol
bind = $mod, Escape, exec, hyprlock

# ==========================================
# System Control (Audio & Brightness)
# ==========================================
binde = , XF86AudioRaiseVolume, exec, pamixer -i 5
binde = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioMicMute, exec, pamixer --default-source -t
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

binde = , XF86MonBrightnessUp, exec, brightnessctl set +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ==========================================
# Window Management & Layouts
# ==========================================
bind = $mod, F, fullscreen, 0
bind = $mod, V, togglefloating,
bind = $mod, P, pseudo,

# FIXED: Modern dispatcher syntax for togglesplit
bind = $mod, J, layoutmsg, togglesplit

# Move Focus (Vim keys)
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d

# Move Focus (Arrow keys)
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Resize Windows (Hold Mod + Alt + Arrow Keys)
binde = $mod ALT, right, resizeactive, 30 0
binde = $mod ALT, left, resizeactive, -30 0
binde = $mod ALT, up, resizeactive, 0 -30
binde = $mod ALT, down, resizeactive, 0 30

# Move/Resize windows with mod + Mouse drag
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ==========================================
# Screenshots & Extra Utilities
# ==========================================
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim ~/Pictures/$(date +'%Y-%m-%d_%H-%M-%S').png

# ==========================================
# Workspaces (1 to 10)
# ==========================================
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# ==========================================
# Window Rules (UI Enhancements)
# ==========================================
# NOTE: Verify the window class with `hyprctl clients` after the next pavucontrol
# launch — on native Wayland the app_id may be `org.pulseaudio.pavucontrol`
# rather than `pavucontrol`, in which case these matches need updating.
# NOTE: windowrulev2 still works, but is deprecated (aliased to `windowrule`) as
# of Hyprland 0.50+; rename the keyword to `windowrule` if on 0.50 or newer.
windowrulev2 = float,class:^(pavucontrol)$
windowrulev2 = size 600 400,class:^(pavucontrol)$
windowrulev2 = center,class:^(pavucontrol)$
