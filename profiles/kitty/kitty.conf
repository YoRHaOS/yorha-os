# Aki's daily kitty — frosted glass to match the desktop.
# Hyprland blurs whatever is behind a transparent window, so opacity < 1 here
# is all it takes to get the glass effect.

font_family      JetBrainsMono Nerd Font
font_size        11.5

background_opacity 0.82
window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no

cursor_shape beam
cursor_blink_interval 0.6

# DMS/matugen can write a wallpaper-matched colour theme for kitty; if it
# exists, it's picked up here. Missing file is harmless.
include dank-theme.conf
